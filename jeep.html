<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم سيارات الجيب - معرض البرحه</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --text-main: #f3f4f6; --text-muted: #9ca3af; --accent-color: #d97706; --border-color: #1f2937; }
        html.light { --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --accent-color: #b45309; --border-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-bottom: 3rem; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: var(--text-main); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px; background: var(--border-color); padding: 0.5rem 1rem; border-radius: 50px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent-color); }
        p.sub { color: var(--text-muted); margin-bottom: 2rem; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .gallery-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .gallery-item img { width: 100%; height: 240px; object-fit: cover; }
        .gallery-info { padding: 1rem; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
            <div style="font-weight: 900; color: var(--accent-color);">معرض البرحه - صنعاء</div>
        </div>
    </header>
    <div class="container">
        <h1>سيارات الجيب والدفع الرباعي - المعرض الكامل</h1>
        <p class="sub">استعراض كافة صور وتفاصيل سيارات الجيب المتوفرة في المعرض.</p>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="rav4/IMG-20260729-WA0015.jpg"><div class="gallery-info">سيارة الجيب - واجهة أمامية</div></div>
            <div class="gallery-item"><img src="rav4/IMG-20260729-WA0017.jpg"><div class="gallery-info">المظهر الجانبي</div></div>
            <div class="gallery-item"><img src="rav4/IMG-20260729-WA0019.jpg"><div class="gallery-info">المقصورة الداخلية</div></div>
        </div>
    </div>
</body>
</html>
